<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 - Akses Ditolak</title>
    <!-- Menggunakan Bootstrap 5 CDN untuk styling cepat -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .error-card {
            text-align: center;
            padding: 40px;
            border-radius: 16px;
            background: #ffffff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            max-width: 500px;
            width: 90%;
        }
        .error-code {
            font-size: 5rem;
            font-weight: 800;
            color: #dc3545;
            line-height: 1;
            margin-bottom: 10px;
        }
        .lock-icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="error-card">
        <div class="lock-icon"><i class="bi bi-lock-fill h1"></i></div>
        <div class="error-code">403</div>
        <h3 class="fw-bold mb-3">Akses Ditolak!</h3>
        <p class="text-muted mb-4">
            Maaf, Anda tidak memiliki izin untuk mengakses halaman ini. Silakan periksa kembali akun atau hak akses Anda.
        </p>
        
        <!-- Tombol Arahkan ke Home -->
        <a href="{% url '' %}" class="btn btn-primary btn-lg px-4 rounded-pill fw-semibold fs-6">
            Kembali ke Dashboard
        </a>
    </div>

</body>
</html>
